name: Check and deploy web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:4100
      - name: Package immutable application release
        run: |
          mkdir -p release
          mkdir -p release/.next
          cp -R .next/standalone release/.next/standalone
          mkdir -p release/.next/standalone/.next
          cp -R .next/static release/.next/standalone/.next/static
          if [[ -d public ]]; then cp -R public release/.next/standalone/public; fi
          cp -R deploy release/deploy
          tar -C release -czf quotient-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: quotient-web
          path: quotient-web.tar.gz
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quotient-web
      - name: Upload release and health-check PM2 process
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.EC2_DEPLOY_ROOT || '/srv/quotient-web' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_path="$RUNNER_TEMP/quotient_web_key"
          known_hosts_path="$RUNNER_TEMP/quotient_web_known_hosts"
          trap 'rm -f "$key_path" "$known_hosts_path"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$key_path"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_path"
          remote="${EC2_USER}@${EC2_HOST}"
          ssh_args=(-i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_path")
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$1/releases/$2"
          REMOTE
          rsync --archive -e "ssh -i $key_path -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path" quotient-web.tar.gz "$remote:$DEPLOY_ROOT/releases/$release_id/release.tar.gz"
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          tar -xzf "$1/releases/$2/release.tar.gz" -C "$1/releases/$2"
          bash "$1/releases/$2/deploy/deploy-remote.sh" "$1"
          REMOTE
