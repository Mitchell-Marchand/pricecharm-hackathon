name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check --workspace @pricecharm/web
      - run: npm run typecheck --workspace @pricecharm/web
      - name: Require the public keys a deployable build needs
        if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          # The deployed API rejects signups and new customer chats without a Turnstile token.
          test -n "$TURNSTILE_SITE_KEY" || { echo "Set the TURNSTILE_SITE_KEY repository variable."; exit 1; }
      - run: npm run build --workspace @pricecharm/web
        env:
          API_BASE_URL: http://127.0.0.1:4100
          # Link previews and the sitemap point here.
          NEXT_PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://pricecharm.com' }}
          # Both are public by design; they ship in the browser bundle.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_WEB_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          # PostHog project key for session recordings. Public by design; empty turns them off.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
      - name: Package an immutable release
        # Standalone output mirrors the monorepo, so the server lives at apps/web/server.js inside it.
        run: |
          mkdir -p release/.next
          cp -R apps/web/.next/standalone release/.next/standalone
          cp -R apps/web/.next/static release/.next/standalone/apps/web/.next/static
          if [[ -d apps/web/public ]]; then cp -R apps/web/public release/.next/standalone/apps/web/public; fi
          cp -R apps/web/deploy release/deploy
          tar -C release -czf pricecharm-web.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pricecharm-web
          path: pricecharm-web.tar.gz
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pricecharm-web
      - name: Upload release and health-check PM2 process
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.EC2_WEB_DEPLOY_ROOT || '/srv/quotient-web' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_path="$RUNNER_TEMP/pricecharm_web_key"
          known_hosts_path="$RUNNER_TEMP/pricecharm_web_known_hosts"
          trap 'rm -f "$key_path" "$known_hosts_path"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$key_path"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_path"
          remote="${EC2_USER}@${EC2_HOST}"
          ssh_args=(-i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_path")
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$1/releases/$2"
          REMOTE
          rsync --archive -e "ssh -i $key_path -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path" pricecharm-web.tar.gz "$remote:$DEPLOY_ROOT/releases/$release_id/release.tar.gz"
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          tar -xzf "$1/releases/$2/release.tar.gz" -C "$1/releases/$2"
          bash "$1/releases/$2/deploy/deploy-remote.sh" "$1"
          REMOTE
