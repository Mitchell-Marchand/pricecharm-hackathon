name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: quoting_ci
          MARIADB_USER: quoting_ci
          MARIADB_PASSWORD: quoting-ci-test-password
          MARIADB_ROOT_PASSWORD: quoting-ci-root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      APP_ENV: test
      AI_PROVIDER: demo
      MAIL_PROVIDER: local
      BILLING_PROVIDER: local
      RUN_DB_TESTS: '1'
      APP_ORIGIN: http://localhost:3100
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: quoting_ci
      DB_USER: quoting_ci
      DB_PASS: quoting-ci-test-password
      DB_CONNECTION_LIMIT: '5'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check --workspace @pricecharm/api
      - run: npm run typecheck --workspace @pricecharm/api
      - name: Migrate the CI database
        run: npm run migrate --workspace @pricecharm/api
      - run: npm test --workspace @pricecharm/api
      - run: npm run build --workspace @pricecharm/api
      - name: Package an immutable release
        # The server installs production dependencies from the root lockfile, so the release keeps
        # the workspace layout: root package files, apps/api, and the other workspace manifests.
        run: |
          mkdir -p release/apps/api release/apps/web
          cp package.json package-lock.json release/
          cp -R packages release/
          cp -R apps/api/package.json apps/api/dist apps/api/migrations apps/api/deploy apps/api/docs release/apps/api/
          cp apps/web/package.json release/apps/web/
          tar -C release -czf pricecharm-api.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pricecharm-api
          path: pricecharm-api.tar.gz
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pricecharm-api
      - name: Upload release and health-check PM2 processes
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.EC2_API_DEPLOY_ROOT || '/srv/quotient-api' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_path="$RUNNER_TEMP/pricecharm_api_key"
          known_hosts_path="$RUNNER_TEMP/pricecharm_api_known_hosts"
          trap 'rm -f "$key_path" "$known_hosts_path"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$key_path"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_path"
          remote="${EC2_USER}@${EC2_HOST}"
          ssh_args=(-i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_path")
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$1/releases/$2"
          REMOTE
          rsync --archive -e "ssh -i $key_path -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path" pricecharm-api.tar.gz "$remote:$DEPLOY_ROOT/releases/$release_id/release.tar.gz"
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$DEPLOY_ROOT" "$release_id" <<'REMOTE'
          set -euo pipefail
          tar -xzf "$1/releases/$2/release.tar.gz" -C "$1/releases/$2"
          bash "$1/releases/$2/apps/api/deploy/deploy-remote.sh" "$1"
          REMOTE
